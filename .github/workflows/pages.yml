name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://roofinglists.com
      - name: Confirm static files
        run: |
          test -f out/CNAME
          test -f out/.nojekyll
          test -d out/dayton-oh
          test -d out/dayton-oh/roof-repair
          test "$(tr -d '[:space:]' < out/CNAME)" = "roofinglists.com"
          KEY_FILE=$(find public -maxdepth 1 -regextype posix-egrep -regex '.*/[0-9a-f]{32}\.txt' | head -1)
          test -n "$KEY_FILE"
          KEY=$(basename "$KEY_FILE" .txt)
          test -f "out/${KEY}.txt"
          test "$(tr -d '[:space:]' < "out/${KEY}.txt")" = "$KEY"
      - name: Collect sitemap locs for IndexNow
        run: node scripts/indexnow-ping.mjs --sitemap out/sitemap.xml --write indexnow-urls.json
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-urls
      - name: Ping IndexNow with sitemap locs
        run: node scripts/indexnow-ping.mjs --urls indexnow-urls.json
